[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-ai-features"
version = "0.1.0"
description = "Spark Structured Streaming over tracker events: watermark windows, a dead-letter queue, and AI-ready session vectors."
requires-python = ">=3.11"
dependencies = [
  "pyspark>=3.5,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
stream-features = "stream_features.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
